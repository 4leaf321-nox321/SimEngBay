[project]
name = "simengbay-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

# 의존성 정본은 requirements.txt 다. 폐쇄망 배포가 `pip wheel -r requirements.txt`
# 로 wheel 번들을 만들고 서버는 --no-index 로 설치하므로, 전이 의존성까지 고정된
# 파일이 하나 있어야 한다.

[tool.ruff]
line-length = 95
target-version = "py312"
src = [".", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 「개발사 › 국가」 의 `›` 는 화면에 그대로 나가는 구분자다 — `>` 로 바꾸면 조건식처럼
# 읽혀 「개발사 > 국가」(국가보다 크다)가 된다.
allowed-confusables = ["›"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의 의존성 주입은 기본값 자리에 Depends() 를 쓰는 것이 정식 문법이라
# B008(기본 인자에서 함수 호출)이 전부 오탐이 된다.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.File",
  "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# Alembic 이 생성한 파일은 손대지 않는 한 그대로 둔다. 여기를 린트에 맞추려고
# 생성 결과를 매번 손보면, 정작 사람이 쓴 부분의 변경이 묻힌다.
"migrations/versions/*" = ["E501", "I001", "UP035", "UP007"]
# 비교키 정규화는 **전각·유사 문자 자체가 소재**다. 그것을 "오타 아니냐" 고 묻는
# 검사와는 맞지 않는다 — 여기서는 그 문자가 정답이다.
"app/shared/text.py" = ["RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

# openpyxl 은 타입 스텁을 따로 배포한다(types-openpyxl). 배포 이미지에 스텁을 넣을 이유가
# 없고, 쓰는 자리가 함수 하나라 여기서만 모르는 것으로 둔다.
[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

# **워커에만 있는 것들**(requirements-worker.txt). API 서버 · CI 에는 없으므로 여기서 타입을
# 찾을 수 없는 것이 정상이다 — `app/core` 가 함수 안에서만 import 하는 이유도 같다.
[[tool.mypy.overrides]]
module = ["ansys.*", "numpy.*", "pyvista.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# **Ansys 가 필요한 시험은 기본으로 돌지 않는다.** CI 에도 대부분의 PC 에도 Ansys 가 없고,
# 없는 것을 이유로 빨간 줄이 서면 사람은 곧 전체 결과를 안 읽는다. 돌리려면:
#   SIMENGBAY_ANSYS=1 .venv/bin/python -m pytest -m ansys
addopts = "-q -m 'not ansys'"
markers = ["ansys: 진짜 Ansys 가 있어야 도는 시험(실행기 · 라이선스)"]
